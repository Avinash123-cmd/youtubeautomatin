# Production stack: built images, Caddy TLS front door, scheduled PostgreSQL backups.
# Only Caddy publishes ports; the database, Redis and app services stay internal.
x-api-env: &api-env
  NODE_ENV: production
  APP_URL: ${APP_URL:?set APP_URL to the public https origin}
  API_PORT: '4000'
  HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS:-5000}
  WORKER_SHUTDOWN_GRACE_MS: ${WORKER_SHUTDOWN_GRACE_MS:-30000}
  API_INTERNAL_URL: http://api:4000
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS to the public https origin}
  TIMEZONE: ${TIMEZONE:?set TIMEZONE explicitly}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-clipforge}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clipforge}
  REDIS_URL: redis://redis:6379
  REDIS_PREFIX: ${REDIS_PREFIX:-clipforge}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
  STORAGE_DRIVER: ${STORAGE_DRIVER:?set STORAGE_DRIVER explicitly (local or s3)}
  STORAGE_LOCAL_ROOT: /data/storage
  STORAGE_LOCAL_PUBLIC_BASE_URL: ${STORAGE_LOCAL_PUBLIC_BASE_URL:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-${STORAGE_PUBLIC_BASE_URL:-}}
  WORK_DIR: /data/work
  UPLOAD_PART_SIZE_MIB: ${UPLOAD_PART_SIZE_MIB:-16}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  BACKUP_DIR: /backups
  AI_ENGINE_URL: http://ai-engine:8100
  AI_ENGINE_API_KEY: ${AI_ENGINE_API_KEY:?set AI_ENGINE_API_KEY}
  VIDEO_PROCESSOR_URL: http://video-processor:8200
  VIDEO_PROCESSOR_API_KEY: ${VIDEO_PROCESSOR_API_KEY:?set VIDEO_PROCESSOR_API_KEY}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-}
  GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN for bot-only authentication}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  TELEGRAM_BOT_ID: ${TELEGRAM_BOT_ID:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?set TELEGRAM_BOT_USERNAME for bot-only authentication}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET for bot-only authentication}
  TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
  TELEGRAM_LOGIN_CHALLENGE_TTL_SECONDS: ${TELEGRAM_LOGIN_CHALLENGE_TTL_SECONDS:-300}
  TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
  TELEGRAM_TIMEOUT_MS: ${TELEGRAM_TIMEOUT_MS:-5000}
  TELEGRAM_MAX_ATTEMPTS: ${TELEGRAM_MAX_ATTEMPTS:-3}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  OTP_SECRET: ${OTP_SECRET:-}
  OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
  OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
  OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
  # YouTube URL import (yt-dlp + ffmpeg are in the API image).
  YOUTUBE_IMPORT_ENABLED: ${YOUTUBE_IMPORT_ENABLED:-true}
  YTDLP_PATH: ${YTDLP_PATH:-/usr/local/bin/yt-dlp}
  YOUTUBE_IMPORT_MAX_HEIGHT: ${YOUTUBE_IMPORT_MAX_HEIGHT:-1080}
  YOUTUBE_IMPORT_TIMEOUT_SECONDS: ${YOUTUBE_IMPORT_TIMEOUT_SECONDS:-1800}
  YOUTUBE_IMPORT_MAX_FILESIZE_MB: ${YOUTUBE_IMPORT_MAX_FILESIZE_MB:-2048}
  YOUTUBE_COOKIES_FILE: ${YOUTUBE_COOKIES_FILE:-}
  YOUTUBE_PROXY: ${YOUTUBE_PROXY:-}
  YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
  YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
  YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_REDIRECT_URI: ${META_REDIRECT_URI:-}
  META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-clipforge}
      TZ: ${TIMEZONE:?set TIMEZONE explicitly}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/scripts/backups:/backups
    expose: ['5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-clipforge} -d ${POSTGRES_DB:-clipforge}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-bookworm
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: ['redis-data:/data']
    expose: ['6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ['node', 'apps/api/dist/main.js']
    environment:
      <<: *api-env
      RUN_MIGRATIONS: '1'
    volumes:
      - storage-data:/data/storage
      - work-data:/data/work
    expose: ['4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    restart: unless-stopped

  worker-ai:
    stop_grace_period: 45s
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ['node', 'apps/api/dist/workers/pipeline.worker.js']
    environment: *api-env
    volumes: ['storage-data:/data/storage', 'work-data:/data/work']
    depends_on: [api, redis]
    restart: unless-stopped

  worker-render:
    stop_grace_period: 45s
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ['node', 'apps/api/dist/workers/render.worker.js']
    environment: *api-env
    volumes: ['storage-data:/data/storage', 'work-data:/data/work']
    depends_on: [api, redis]
    restart: unless-stopped

  worker-publish:
    stop_grace_period: 45s
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ['node', 'apps/api/dist/workers/publish.worker.js']
    environment: *api-env
    volumes: ['storage-data:/data/storage', 'work-data:/data/work']
    depends_on: [api, redis]
    restart: unless-stopped

  worker-scheduler:
    stop_grace_period: 45s
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ['node', 'apps/api/dist/workers/scheduler.worker.js']
    environment: *api-env
    volumes: ['work-data:/data/work']
    depends_on: [api, redis]
    restart: unless-stopped

  worker-recovery:
    stop_grace_period: 45s
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ['node', 'apps/api/dist/workers/recovery.worker.js']
    environment: *api-env
    volumes: ['work-data:/data/work']
    depends_on: [api, redis]
    restart: unless-stopped

  ai-engine:
    build:
      context: .
      dockerfile: infrastructure/docker/ai-engine.Dockerfile
    environment:
      AI_ENGINE_API_KEY: ${AI_ENGINE_API_KEY:?set AI_ENGINE_API_KEY}
      NODE_ENV: production
      AI_PROVIDER: ${AI_PROVIDER:?set AI_PROVIDER explicitly (gemini or fixture for tests)}
      TEST_MODE: ${TEST_MODE:-0}
      WORK_DIR: /data/work
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-}
      WHISPER_MODEL: ${WHISPER_MODEL:?set WHISPER_MODEL explicitly}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes: ['model-cache:/home/app/.cache/huggingface', 'work-data:/data/work']
    expose: ['8100']
    restart: unless-stopped

  video-processor:
    build:
      context: .
      dockerfile: infrastructure/docker/video-processor.Dockerfile
    environment:
      VIDEO_PROCESSOR_API_KEY: ${VIDEO_PROCESSOR_API_KEY:?set VIDEO_PROCESSOR_API_KEY}
      WORK_DIR: /data/work
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    volumes:
      - storage-data:/data/storage
      - work-data:/data/work
    expose: ['8200']
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        UPLOAD_CSP_ORIGINS: ${UPLOAD_CSP_ORIGINS:-${S3_ENDPOINT:-}}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    expose: ['3000']
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    depends_on: [web, api]
    environment:
      CLIPFORGE_DOMAIN: ${CLIPFORGE_DOMAIN:?set CLIPFORGE_DOMAIN (public hostname)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for certificate expiry notices}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./infrastructure/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  backup:
    image: postgres:17.11-bookworm
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-clipforge}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-clipforge}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ['/bin/sh', '/scripts/backup-loop.sh']
    volumes:
      - ./infrastructure/scripts:/scripts:ro
      - ./infrastructure/scripts/backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  storage-data:
  work-data:
  model-cache:
