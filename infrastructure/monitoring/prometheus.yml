# JSON readiness endpoints are HTTP-probed by blackbox-exporter, never parsed as metrics.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [alerts.yml]
scrape_configs:
  - job_name: clipforge-readiness
    metrics_path: /probe
    params:
      module: [http_ready]
    static_configs:
      - targets:
          - http://api:4000/api/system/health
          - http://ai-engine:8100/health
          - http://video-processor:8200/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
