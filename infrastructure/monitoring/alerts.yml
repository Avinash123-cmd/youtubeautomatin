groups:
  - name: clipforge-availability
    rules:
      - alert: ServiceNotReady
        expr: probe_success{job="clipforge-readiness"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'ClipForge dependency is not ready: {{ $labels.instance }}'
          description: 'HTTP status or readiness body failed. Consult authenticated system diagnostics.'
      - alert: ReadinessMonitorDown
        expr: up{job="clipforge-readiness"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: 'Readiness monitor is unavailable (not proof the target is down)'
