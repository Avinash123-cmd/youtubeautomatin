# Render API foundation blueprint. NOT a complete video-processing deployment.
# External private S3 storage and Telegram bot configuration are REQUIRED.
# Managed free DB/Redis plans here are evaluation-only, not durable production guarantees.
# Use paid managed persistence for production; configure/review settings on existing services
# instead of creating duplicate APIs. See docs/foundation-audit.md.
# API health probes verify actual Postgres, Redis and storage byte readback.
# No destructive reset or automatic migration is configured. Apply reviewed additive migrations
# as a controlled release step using npm run db:deploy after backup.
# Separate Render media services do NOT share WORK_DIR automatically: render.pipeline.yaml
# needs a shared-filesystem/transfer design before its processing path can work.

databases:
  - name: clipforge-db
    plan: free
    databaseName: clipforge
    user: clipforge
    ipAllowList: [] # internal network only

services:
  # Render Key Value — the BullMQ backend. Internal connections only.
  - type: keyvalue
    name: clipforge-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction # a queue must never evict a job to make room
    persistenceMode: off # not available on free instances

  # ------------------------------------------------------------------ the API
  - type: web
    name: clipforge-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/api.Dockerfile
    dockerContext: .
    plan: free # change to `starter` if you want no cold starts (and have a payment method)
    healthCheckPath: /api/system/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000
      - key: RUN_MIGRATIONS # controlled release step, not automatic boot-time migration
        value: 0
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: info

      # --- the origin of the deployed dashboard. Change it if your Vercel domain differs. ---
      - key: APP_URL
        value: https://youtubeautomation-mauve.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://youtubeautomation-mauve.vercel.app

      # --- managed services created by this same blueprint ---
      - key: DATABASE_URL
        fromDatabase:
          name: clipforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: clipforge-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_PREFIX
        value: clipforge

      # --- secrets generated once, readable later in the Render dashboard ---
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false # existing/base64 32-byte key; never rotate without credential re-encryption
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_TOKEN # this is what you type into "First-run setup"
        generateValue: true
      - key: ALLOW_SELF_REGISTRATION
        value: false

      # Private durable S3-compatible storage; no ephemeral /tmp source-video store.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: WORK_DIR
        value: /tmp/clipforge/work

      # --- internal services that this free stack does not run ---
      # The API requires these to boot, so they point at nothing and every probe reports them
      # down, which is the truth. A full processing deployment also needs a shared WORK_DIR.
      - key: AI_ENGINE_URL
        value: https://ai-engine.not-deployed.invalid
      - key: AI_ENGINE_API_KEY
        generateValue: true
      - key: VIDEO_PROCESSOR_URL
        value: https://video-processor.not-deployed.invalid
      - key: VIDEO_PROCESSOR_API_KEY
        generateValue: true

      # Telegram bot is the ONLY active authentication mechanism.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_CHAT_ID # optional outbound notifications
        sync: false

      # --- optional: Gemini for real transcripts/metadata (the pipeline needs it) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-2.0-flash

      # --- queue/tuning ---
      - key: UPLOAD_PART_SIZE_MIB
        value: 16
      - key: WORKER_CONCURRENCY_AI
        value: 2
      - key: WORKER_CONCURRENCY_RENDER
        value: 1
      - key: WORKER_CONCURRENCY_PUBLISH
        value: 2
      - key: JOB_LEASE_SECONDS
        value: 900
      - key: JOB_HEARTBEAT_SECONDS
        value: 15
